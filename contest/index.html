<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Background Change</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Verdana, sans-serif;
    }

    body {
        background: url('lake.jpg') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 1s ease-in-out;
    }

    video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        display: none;
    }

    video.active {
        display: block;
    }

    .center-content {
        text-align: center;
        color: #fff44f;; /* lemon yellow */
        background: rgba(0,0,0,0.4); /* subtle overlay for contrast */
        padding: 50px 80px;
        border-radius: 15px;
        transition: opacity 0.5s ease-in-out;
    }

    .center-content h1 {
        margin-bottom: 30px;
        font-size: 2em;
    }

    .center-content button {
        font-size: 1.5em;
        padding: 15px 40px;
        background: transparent;
        border: 2px solid #fff44f;;
        color: #fff44f;;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .center-content button:hover {
        background: #fff44f;;
        color: black;
    }

    .hidden {
        display: none;
    }
</style>
</head>
<body>

<video id="bgVideo" autoplay muted loop>
    <source src="result.mp4" type="video/mp4">
</video>

<div id="firstDiv" class="center-content">
    <h1>ΚΑΛΩΣΗΡΘΕΣ ΣΤΟΜ ΜΕΓΑΛΟ ΔΙΑΓΩΝΙΣΜΟ ΤΗΣ ΠΑΡΟΥΣΊΑΣΗΣ</h1>
    <button id="actionBtn">ΚΑΝΕ ΚΛΙΚ ΝΑ ΔΕΙΣ ΤΙ ΚΕΡΔΙΣΕΣ</button>
</div>

<div id="secondDiv" class="center-content hidden">
    <h1>0 ΕΥΡΩ</h1>
        <button id="backBtn">ΔΟΚΙΜΑΣΕ ΞΑΝΑ</button>
</div>

<script>
    const button = document.getElementById('actionBtn');
    const backBtn = document.getElementById('backBtn');
    const firstDiv = document.getElementById('firstDiv');
    const secondDiv = document.getElementById('secondDiv');
    const bgVideo = document.getElementById('bgVideo');

    button.addEventListener('click', () => {
        // Fade out first div
        firstDiv.style.opacity = 0;
        
        setTimeout(() => {
            // Show video background
            bgVideo.classList.add('active');

            // Hide first div and show second
            firstDiv.classList.add('hidden');
            secondDiv.classList.remove('hidden');

            // Fade in second div
            secondDiv.style.opacity = 0;
            setTimeout(() => {
                secondDiv.style.opacity = 1;
            }, 50);

        }, 500); // matches transition
    });

    backBtn.addEventListener('click', () => {
        location.reload();
    });
</script>


</body>
</html>
