<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Εφαρμογη Ψηφιακής Αποκατάστασης - Unearthed Χανιά 2026</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      touch-action: none;
    }

    /* TOP BAR (full width) */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 18px;
      box-sizing: border-box;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);

      color: white;
      font-family: Arial, sans-serif;

      text-align: center;
    }

    .top-bar .title {
      font-weight: bold;
      font-size: 18px;
    }

    .top-bar .desc {
      font-size: 16px;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* BOTTOM BAR (flex layout) */
    .bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 10px 14px;
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);

      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;

      min-width: min(600px, 90vw);
    }

    /* buttons */
    button {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* center hint text */
    .hint-text {
      flex: 1;
      text-align: center;
      opacity: 0.9;
      user-select: none;
      font-size: 16px;
    }

    #loaderOverlay {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);

      z-index: 999;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #loaderOverlay.show {
      visibility: visible;
      opacity: 1;
    }

    .spinner {
      width: 48px;
      height: 48px;

      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/"
  }
}
</script>
</head>

<body>
  <div class="top-bar" id="infoBox">
    <div class="title">Model 1</div>
    <div class="desc">This is the first model description.</div>
  </div>

  <div id="loaderOverlay">
    <div style="text-align:center; color:white; font-family:Arial;">
      <div class="spinner" style="margin:0 auto 12px;"></div>
      <div id="loadingText">0%</div>
    </div>
  </div>

  <div class="bottom-bar">
    <button id="prevBtn">Προηγούμενο</button>

    <div class="hint-text">
      Σύρτε δεξιά / αριστερά για περιστροφή.
    </div>

    <button id="nextBtn">Επόμενο</button>
  </div>

  <script type="module">
    document.getElementById('nextBtn').addEventListener('click', () => {



      const next = (currentIndex + 1) % models.length;
      loadModel(next);

    });

    const loaderOverlay =
      document.getElementById('loaderOverlay');

    const loadingText =
      document.getElementById('loadingText');

    document.getElementById('prevBtn').addEventListener('click', () => {

      const prev = (currentIndex - 1 + models.length) % models.length;
      loadModel(prev);

    });

    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/loaders/GLTFLoader.js';

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.z = 3.5;
    camera.position.y = 0.8;
    camera.rotation.x = -THREE.MathUtils.degToRad(10);

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });


    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    document.body.appendChild(renderer.domElement);

    // Model
    const loader = new GLTFLoader();

    const models = [
      {
        file: 'vazo_0.glb',
        title: 'Δοχείο',
        desc: 'Ένα σπασμένο κεραμικό δοχείο κατασκευασμένο από τον Γιώργο Κοκοβλή. Οι διαστάσεις του είναι: 25 εκ. διάμετρος, 11.3 εκ ύψος. Δεν εχει βρεθεί το ένα κομμάτι.',
        isWireframe: false
      },
      {
        file: 'vazo_0.glb',
        title: 'Δοχείο (σχήμα)',
        desc: 'Γεωμετρική ανάλυση του σπασμένου δοχείου.',
        isWireframe: true
      },
      {
        file: 'vazo_2.glb',
        title: 'Υπολειπόμμενο κομμάτι',
        desc: 'Υπόθεση του σχήματος του υπολειπόμμενου κομματιού.',
        isWireframe: false
      },
      {
        file: 'vazo_2.glb',
        title: 'Υπολειπόμμενο κομμάτι (σχήμα)',
        desc: 'Γεωμετρική ανάλυση του υπολειπόμμενου κομματιού.',
        isWireframe: true
      },
      {
        file: 'vazo_3.glb',
        title: 'Δοχείο με υπολειπόμμενο κομμάτι',
        desc: 'Το δοχείο με την προσθήκη του εκτυπωμένου κομματιού.',
        isWireframe: false
      },
      {
        file: 'vazo_1.glb',
        title: 'Δοχείο με υπολειπόμμενο κομμάτι',
        desc: 'Υπόθεση του πλήρους σχήματος του δοχείου.',
        isWireframe: false
      },
    ];

    let currentIndex = 0;
    let model = null;

    loadModel(0);

    // Interaction state
    let isDragging = false;
    let previousX = 0;
    let rotationVelocity = 0;

    const dragSensitivity = 0.01;
    const damping = 0.92;

    function pointerDown(x) {
      isDragging = true;
      previousX = x;
    }

    function pointerMove(x) {
      if (!isDragging) return;

      const deltaX = x - previousX;
      previousX = x;

      rotationVelocity = deltaX * dragSensitivity;
    }

    function pointerUp() {
      isDragging = false;
    }

    function loadModel(index) {

      currentIndex = index;

      const data = models[index];

      if (model) {
        scene.remove(model);
      }

      showLoader();
      loadingText.textContent = "0%";

      loader.load(

        data.file,

        (gltf) => {

          model = gltf.scene;

          model.traverse((child) => {

            if (!child.isMesh) return;

            if (data.isWireframe) {

              const solid = new THREE.MeshBasicMaterial({
                color: 0x27689e
              });

              child.material = solid;

              const edges = new THREE.EdgesGeometry(child.geometry);

              const lines = new THREE.LineSegments(
                edges,
                new THREE.LineBasicMaterial({
                  color: 0xffffff
                })
              );

              child.add(lines);
            }
          });

          scene.add(model);

          hideLoader();
        },

        // progress callback
        (xhr) => {

          if (xhr.total) {

            const percent = (xhr.loaded / xhr.total) * 100;

            loadingText.textContent =
              `${Math.min(100, Math.round(percent))}%`;
          }
        },

        (error) => {

          console.error(error);

          loadingText.textContent = "Error";
          hideLoader();
        }

      );

      document.querySelector('#infoBox .title').textContent = data.title;
      document.querySelector('#infoBox .desc').textContent = data.desc;

      updateButtons();
    }

    function updateButtons() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (currentIndex === 0) {
        prevBtn.textContent = 'Τελευταίο';
      } else {
        prevBtn.textContent = 'Προηγούμενο';
      }

      if (currentIndex === models.length - 1) {
        nextBtn.textContent = 'Πίσω στην αρχή';
      } else {
        nextBtn.textContent = 'Επόμενο';
      }
    }

    function showLoader() {
      loaderOverlay.classList.add('show');
    }

    function hideLoader() {
      loaderOverlay.classList.remove('show');
    }

    // Mouse events
    window.addEventListener('mousedown', (e) => {
      pointerDown(e.clientX);
    });

    window.addEventListener('mousemove', (e) => {
      pointerMove(e.clientX);
    });

    window.addEventListener('mouseup', pointerUp);
    window.addEventListener('mouseleave', pointerUp);

    // Touch events
    window.addEventListener('touchstart', (e) => {
      pointerDown(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      pointerMove(e.touches[0].clientX);
    }, { passive: true });

    window.addEventListener('touchend', pointerUp, { passive: true });

    // Resize
    window.addEventListener('resize', () => {

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });

    // Animation loop
    function animate() {

      requestAnimationFrame(animate);

      if (model) {
        model.rotation.y += rotationVelocity;
      }

      rotationVelocity *= damping;

      renderer.render(scene, camera);

    }

    animate();

  </script>
</body>

</html>
